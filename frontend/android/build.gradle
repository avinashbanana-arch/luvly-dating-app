// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// Preferences ships with a Java 21 compile target, while this app's Android
// toolchain is Java 20. Its implementation uses no Java 21-only APIs, so keep
// the plugin aligned with the app's supported target.
gradle.afterProject { project ->
    if (project.name == "capacitor-preferences") {
        project.android.compileOptions {
            sourceCompatibility JavaVersion.VERSION_20
            targetCompatibility JavaVersion.VERSION_20
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
